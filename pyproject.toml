[project]
name = "dkrz-cera"
description = "An interface to the CERA database of the DKRZ (Deutsches Klimarechenzentrum)"
authors = [
  {name = "Markus Ritschel", email = "git@markusritschel.de"},
]
readme = "README.md"
license = {file = "LICENSE"}
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "colorama",
  "dask",
  "Deprecated",
  "ipykernel",
  "ipython",
  "ipywidgets",
  "jupyterlab",
  "jupytext",
  "marimo",
  "markdown",
  "matplotlib",
  "numpy",
  "pandas",
  "python-dotenv",
  "rich",
  "tqdm",
  "xarray",
  "click",
]


# All three CLI flavours expose the entry point as `app`.
[project.scripts]
dkrz-cera = "dkrz_cera.cli:app"



[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
  "pre-commit"
]
lint = [
  "ruff",
  "ty",
]
test = [
  "pytest",
  "pytest-cov",
  "safety",
]
docs = [
"furo",
  "jupyter-book",
  "jupyterbook-latex",
  "linkify-it-py",
  "lxml_html_clean",
  "myst-parser",
  "nbsphinx",
  "pydata-sphinx-theme",
  "rinohtype",
  "sphinx",
  "sphinx-autoapi",
  "sphinx-autobuild",
  "sphinx-autodoc-defaultargs",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme",
  "sphinx-comments",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-immaterial",
  "sphinx-issues",
  "sphinx-rtd-theme",
  "sphinx-tabs",
  "sphinx-toolbox",
  "sphinxcontrib-apidoc",
  "sphinxcontrib-bibtex",
  "sphinxcontrib-htmlhelp",
  "sphinxcontrib-images",
  "sphinxcontrib-mermaid",
  "sphinxcontrib-napoleon",

]


[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"



[tool.jupytext]
formats = "ipynb,py:percent,md:myst"


[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
  "tests",
  "src",
]
addopts = [
  "--doctest-modules",
  "--doctest-continue-on-failure",
  # NOTE: one flag per list entry. "-ra -v" as a single entry is parsed as
  # `-r` with the value "a -v", which silently swallows the -v.
  "-ra",
  "-v",
  "--cov=./src",
  "--cov-report=xml",
  "--cov-report=html",
  "--cov-report=term-missing"
]


[tool.uv]
package = true
